<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #222;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border-radius: 5px;
            border: none;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #4caf50;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Login</h2>

    <!-- Error messages -->
    <div class="error">
        <th:block th:if="${param.error != null and param.error[0] == 'no_user'}">
            User does not exist
        </th:block>

        <th:block th:if="${param.error != null and param.error[0] == 'bad_password'}">
            Incorrect password
        </th:block>
    </div>

    <form method="post" action="/login">
        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <a href="/register" style="color:#4caf50; display:block; margin-top:10px; text-align:center;">
        Create an account
    </a>
</div>

</body>
</html>
