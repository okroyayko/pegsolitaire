<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire – web client</title>

    <link rel="stylesheet" href="/css/game.css">

    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: #222;
            padding: 25px;
            border-radius: 10px;
            color: #eee;
            text-align: center;
            width: 300px;
            border: 2px solid #4caf50;
        }

        .modal-content button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #4caf50;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .theme-btn {
            margin-left: auto;
            margin-right: 70px;
            background: #222;
            border: 2px solid #555;
            color: #ddd;
            font-size: 20px;
            padding: 6px 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s ease;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f2f2 url('/background.png') no-repeat center center fixed;
            background-size: cover;
            color: #000;
        }

        body.dark {
            background: #121212 !important;
            color: #d0d0d0;
        }

        .topbar {
            width: 100%;
            background: #000000;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 120px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #bfbfbf;
        }

        .layout {
            margin-top: 20px;
            padding: 20px;
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 25px;
        }

        .panel {
            background: rgba(255,255,255,0.85);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .panel h2 {
            color: #000;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .center-panel {
            text-align: center;
        }

        button {
            padding: 7px 14px;
            background: #333;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .tile {
            width: 45px;
            height: 45px;
            display: inline-block;
            margin: 3px;
            border-radius: 50%;
        }

        .peg { background: gold; }
        .empty { background: black; }
        .blocked { background: transparent; }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
                padding: 10px;
                gap: 15px;
            }

            #board {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4px;
            }

            .tile {
                width: calc(14vw);
                height: calc(14vw);
                margin: 2px;
            }

            button {
                width: 100%;
                font-size: 18px;
                padding: 12px;
            }

            .topbar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div id="gameMessage" class="modal">
    <div class="modal-content">
        <p id="gameMessageText"></p>
        <button type="button" onclick="closeMessage()">OK</button>
    </div>
</div>

<div class="topbar">
    <img src="/logo.png" alt="Logo" class="logo">
    <div class="title">PegSolitaire – web client</div>

    <div style="margin-left:auto; display:flex; align-items:center; gap:20px;">
        <span style="color:white; font-size:18px;">
            Logged in as: <strong th:text="${user}"></strong>
        </span>

        <a href="/logout" style="color:red; font-size:18px; text-decoration:none;">
            Logout
        </a>

        <button id="themeToggle" class="theme-btn">🌙</button>
    </div>
</div>

<div class="layout">

    <!-- LEFT PANEL -->
    <div class="panel">
        <h2>Player</h2>
        <p><strong th:text="${user}"></strong></p>

        <h2>Top scores</h2>
        <ul>
            <li th:each="s : ${scores}"
                th:text="${s.player} + ' - ' + ${s.points}">score</li>
        </ul>
    </div>

    <!-- CENTER PANEL -->
    <div class="panel center-panel">
        <h2>Game board</h2>

        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px;">
            <button onclick="newGame()">New Game</button>

            <select id="levelSelect" onchange="changeLevel()">
                <option value="level1.txt">Level 1</option>
                <option value="level2.txt">Level 2</option>
                <option value="level3.txt">Level 3</option>
            </select>
        </div>

        <div id="board"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">

        <h2>Comments</h2>

        <ul>
            <li th:each="c : ${comments}">
                <span th:text="${c.player} + ': ' + ${c.comment}"></span>

                <span th:if="${c.player == user}">
                    <form th:action="@{/pegsolitaire/comment/delete}" method="post" style="display:inline;">
                        <input type="hidden" name="game" th:value="${game}">
                        <button type="submit" style="color:red;">Delete</button>
                    </form>

                    <form th:action="@{/pegsolitaire/comment/edit}" method="post" style="display:inline;">
                        <input type="hidden" name="game" th:value="${game}">
                        <input type="text" name="text" placeholder="Edit comment">
                        <button type="submit">Save</button>
                    </form>
                </span>
            </li>
        </ul>

        <div th:if="${!hasComment}">
            <form th:action="@{/pegsolitaire/comment}" method="post">
                <input type="hidden" name="game" th:value="${game}">
                <label>New comment:</label>
                <input type="text" name="text">
                <button type="submit">Add</button>
            </form>
        </div>

        <div th:if="${hasComment}">
            <p>You already posted a comment.</p>
        </div>

        <h2>Rating</h2>

        <p>Average rating: <strong th:text="${averageRating}">0</strong></p>

        <p>Your rating:
            <strong th:if="${userRating > 0}" th:text="${userRating}"></strong>
            <span th:if="${userRating == 0}">You haven't rated yet</span>
        </p>

        <div th:if="${user != null}">
            <form th:action="@{/pegsolitaire/rate}" method="post">
                <input type="hidden" name="game" th:value="${game}">
                <label>Rate (1–5):</label>
                <input type="number" name="rating" min="1" max="5" th:value="${userRating}">
                <button type="submit">Save rating</button>
            </form>
        </div>

        <div th:if="${user == null}">
            <p>You must log in to rate the game.</p>
        </div>

    </div>

</div>

<script src="/js/game.js"></script>

</body>
</html>
