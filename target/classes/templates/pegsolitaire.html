<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire – web client</title>

    <link rel="stylesheet" href="/css/game.css">

    <style>
        .theme-btn {
            margin-left: auto;
            margin-right: 100px;
            background: #222;
            border: 2px solid #555;
            color: #ddd;
            font-size: 20px;
            padding: 6px 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .theme-btn:hover {
            background: #444;
            border-color: #888;
            transform: scale(1.1);
        }
        /* ============================
           LIGHT THEME (default)
        ============================ */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

            /* Твій старий фон-картинка */
            background: #f2f2f2 url('/background.png') no-repeat center center fixed;
            background-size: cover;

            color: #000;
        }

        /* ============================
           DARK THEME
        ============================ */
        body.dark {
            background: #121212 !important; /* темний фон */
            color: #d0d0d0;
        }

        /* Панелі */
        body.dark .panel {
            background: rgba(30, 30, 30, 0.9);
            border-color: #333;
            color: #d0d0d0;
        }

        /* Заголовки */
        body.dark .panel h2,
        body.dark .title {
            color: #d0d0d0;
        }

        /* Кнопки */
        body.dark button {
            background: #333;
            color: #d0d0d0;
            border: 1px solid #555;
        }

        body.dark button:hover {
            background: #444;
        }

        /* Поля вводу */
        body.dark input,
        body.dark select {
            background: #222;
            color: #d0d0d0;
            border: 1px solid #555;
        }

        /* Плитки */
        body.dark .tile {
            background-color: #2a2a2a;
        }

        /* Порожні */
        body.dark .tile.empty {
            background-color: #555;
        }

        /* Заблоковані */
        body.dark .tile.blocked {
            background-color: #1a1a1a;
        }

        /* Пеги */
        body.dark .tile.peg {
            background-color: #d4b000;
        }

        /* Підсвітка */
        body.dark .highlight {
            outline: 2px solid #888;
        }

        /* Обрана клітинка */
        body.dark .selected {
            outline: 2px solid #ccc;
        }

        /* Кнопка теми */
        .theme-btn {
            margin-left: auto;
            margin-right: 70px;
            background: #222;
            border: 2px solid #555;
            color: #ddd;
            font-size: 20px;
            padding: 6px 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .theme-btn:hover {
            background: #444;
            border-color: #888;
            transform: scale(1.1);
        }

        body.dark .theme-btn {
            background: #ddd;
            color: #111;
            border-color: #aaa;
        }

        .topbar {
            width: 100%;
            background: #000000;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 120px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #bfbfbf;
        }

        .layout {
            margin-top: 20px;
            padding: 20px;
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 25px;
        }

        .panel {
            background: rgba(255,255,255,0.85);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .panel h2 {
            color: #000;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .center-panel {
            text-align: center;
        }

        button {
            padding: 7px 14px;
            background: #333;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #000;
        }
    </style>
</head>

<body>

<div class="topbar">
    <img src="/logo.png" alt="Logo" class="logo">

    <div class="title">PegSolitaire – web client</div>

    <button id="themeToggle" class="theme-btn">🌙</button>
</div>



<div class="layout">

    <!-- LEFT PANEL -->
    <div class="panel">
        <h2>Player</h2>
        <form th:action="@{/pegsolitaire}" method="get">
            <input type="text" name="player" th:value="${player}">
            <input type="hidden" name="game" th:value="${game}">
            <button type="submit">Refresh</button>
        </form>

        <h2>Top scores</h2>
        <ul>
            <li th:each="s : ${scores}"
                th:text="${s.player} + ' - ' + ${s.points}">score</li>
        </ul>
    </div>

    <!-- CENTER PANEL -->

    <div class="panel center-panel">
        <h2>Game board</h2>

        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px;">
            <button onclick="newGame()">New Game</button>

            <select id="levelSelect" onchange="changeLevel()">
                <option value="level1.txt">Level 1</option>
                <option value="level2.txt">Level 2</option>
                <option value="level3.txt">Level 3</option>
            </select>
        </div>

        <div id="board"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">

        <h2>Comments</h2>
        <ul>
            <li th:each="c : ${comments}"
                th:text="${c.player} + ': ' + ${c.comment}">comment</li>
        </ul>

        <form th:action="@{/pegsolitaire/comment}" method="post">
            <input type="hidden" name="game" th:value="${game}">
            <input type="hidden" name="player" th:value="${player}">
            <label>New comment:</label>
            <input type="text" name="text">
            <button type="submit">Add</button>
        </form>

        <h2>Rating</h2>
        <p>Average rating: <strong th:text="${averageRating}">0</strong></p>

        <form th:action="@{/pegsolitaire/rate}" method="post">
            <input type="hidden" name="game" th:value="${game}">
            <input type="hidden" name="player" th:value="${player}">
            <label>Rate (1–5):</label>
            <input type="number" name="rating" min="1" max="5">
            <button type="submit">Rate</button>
        </form>

    </div>

</div>

<!-- ONLY ONE JS FILE -->
<script src="/js/game.js"></script>

</body>
</html>
