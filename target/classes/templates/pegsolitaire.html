<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire – web client</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .board {
            border-collapse: collapse;
            margin-top: 20px;
        }

        .board td {
            width: 40px;
            height: 40px;
            border: 1px solid #444;
            text-align: center;
            vertical-align: middle;
            font-size: 28px;
            font-weight: bold;
            padding: 0;
        }

        .tile.peg {
            background-color: #f0f0f0;
            color: #222;
        }
        .tile.peg::after {
            content: "●";
        }

        .tile.empty {
            background-color: #fafafa;
            color: #777;
        }
        .tile.empty::after {
            content: "○";
        }

        .tile.blocked {
            background-color: #ccc;
        }

        form {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            padding: 5px;
            margin-left: 5px;
        }

        button {
            padding: 5px 10px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

<h1>PegSolitaire – web client</h1>

<form th:action="@{/pegsolitaire}" method="get">
    <label>Player:
        <input type="text" name="player" th:value="${player}">
    </label>
    <input type="hidden" name="game" th:value="${game}">
    <button type="submit">Refresh</button>
</form>

<h2>Game board</h2>

<table class="board">
    <tr th:each="row : ${board}">
        <td th:each="cell : ${row}"
            th:class="'tile ' + ${cell.state.toString().toLowerCase()}">
        </td>
    </tr>
</table>

<h2>Top scores</h2>
<ul>
    <li th:each="s : ${scores}"
        th:text="${s.player} + ' - ' + ${s.points}">score</li>
</ul>

<h2>Comments</h2>
<ul>
    <li th:each="c : ${comments}"
        th:text="${c.player} + ': ' + ${c.comment}">comment</li>
</ul>

<form th:action="@{/pegsolitaire/comment}" method="post">
    <input type="hidden" name="game" th:value="${game}">
    <input type="hidden" name="player" th:value="${player}">
    <label>New comment:
        <input type="text" name="text">
    </label>
    <button type="submit">Add comment</button>
</form>

<h2>Rating</h2>
<p>Average rating: <span th:text="${averageRating}">0</span></p>

<form th:action="@{/pegsolitaire/rate}" method="post">
    <input type="hidden" name="game" th:value="${game}">
    <input type="hidden" name="player" th:value="${player}">
    <label>Rate (1–5):
        <input type="number" name="rating" min="1" max="5">
    </label>
    <button type="submit">Rate</button>
</form>

</body>
</html>
